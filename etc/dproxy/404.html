<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No route — dproxy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0 }
    body {
      font-family: system-ui, sans-serif;
      background: #f8f8f8;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    main { text-align: center; padding: 2rem; }
    h1   { font-size: 1.4rem; margin-bottom: .75rem; }
    p    { color: #666; line-height: 1.6; }
    code { background: #eee; padding: 2px 6px; border-radius: 3px; font-size: .9em; }

</head>
<body>
  <main>
    <h1>No route configured</h1>
    <p>dproxy has no route for <code id="h"></code>.</p>

  <script>document.getElementById('h').textContent = location.hostname</script>

</html>
